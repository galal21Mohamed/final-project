apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopverse-frontend-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
spec:
  podSelector:
    matchLabels:
      component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              component: backend
      ports:
        - port: {{ .Values.backend.port }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopverse-backend-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
spec:
  podSelector:
    matchLabels:
      component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: frontend
      ports:
        - port: {{ .Values.backend.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: {{ .Values.backend.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              component: database
      ports:
        - port: {{ .Values.database.port }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopverse-database-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
spec:
  podSelector:
    matchLabels:
      component: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # يقبل من Backend
    - from:
        - podSelector:
            matchLabels:
              component: backend
      ports:
        - port: {{ .Values.database.port }}
    # يقبل من كل pods في نفس الـ namespace
    - from:
        - podSelector:
            matchLabels:
              app: shopverse
      ports:
        - port: {{ .Values.database.port }}
  egress:
    # يسمح للـ database pods بالتحدث مع بعض
    - to:
        - podSelector:
            matchLabels:
              component: database
      ports:
        - port: {{ .Values.database.port }}
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
