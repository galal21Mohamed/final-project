# Backend ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopverse-backend-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: backend
---
# Frontend ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopverse-frontend-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: frontend
---
# Database ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopverse-database-sa
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: database
---
# Backend Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shopverse-backend-role
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: backend
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# Frontend Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shopverse-frontend-role
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: frontend
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
# Backend RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shopverse-backend-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: backend
subjects:
  - kind: ServiceAccount
    name: shopverse-backend-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: shopverse-backend-role
  apiGroup: rbac.authorization.k8s.io
---
# Frontend RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shopverse-frontend-rolebinding
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: frontend
subjects:
  - kind: ServiceAccount
    name: shopverse-frontend-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: shopverse-frontend-role
  apiGroup: rbac.authorization.k8s.io
