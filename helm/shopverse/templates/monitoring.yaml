apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: monitoring
data:
  fluent.conf: |
    <source>
      @type tail
      path /var/log/containers/*shopverse*.log
      pos_file /fluentd/pos/shopverse.pos
      tag shopverse.*
      read_from_head true
      <parse>
        @type json
        time_format %Y-%m-%dT%H:%M:%S.%NZ
      </parse>
    </source>
    <filter shopverse.**>
      @type record_transformer
      <record>
        cluster_name shopverse
        environment {{ .Values.global.environment }}
      </record>
    </filter>
    <match shopverse.**>
      @type stdout
      <format>
        @type json
      </format>
    </match>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: shopverse-log-collector
  namespace: {{ .Values.global.namespace }}
  labels:
    app: shopverse
    component: monitoring
spec:
  selector:
    matchLabels:
      app: shopverse
      component: monitoring
  template:
    metadata:
      labels:
        app: shopverse
        component: monitoring
    spec:
      serviceAccountName: shopverse-backend-sa
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluentd
          image: "{{ .Values.monitoring.image.repository }}:{{ .Values.monitoring.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: {{ .Values.monitoring.resources.requests.memory }}
              cpu: {{ .Values.monitoring.resources.requests.cpu }}
            limits:
              memory: {{ .Values.monitoring.resources.limits.memory }}
              cpu: {{ .Values.monitoring.resources.limits.cpu }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - ps aux | grep fluentd | grep -v grep
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - ps aux | grep fluentd | grep -v grep
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: fluentd-config
              mountPath: /fluentd/etc
            - name: fluentd-pos
              mountPath: /fluentd/pos
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: fluentd-config
          configMap:
            name: fluentd-config
        - name: fluentd-pos
          emptyDir: {}
