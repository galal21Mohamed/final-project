apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shopverse-mysql
  namespace: shopverse
  labels:
    app: shopverse
    component: database
spec:
  serviceName: shopverse-mysql
  replicas: 1
  selector:
    matchLabels:
      app: shopverse
      component: database
  template:
    metadata:
      labels:
        app: shopverse
        component: database
    spec:
      serviceAccountName: shopverse-database-sa

      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999

      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 3306
              name: mysql

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-secret
                  key: DB_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: shopverse-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopverse-secret
                  key: DB_PASSWORD

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Startup Probe
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  mysqladmin ping -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12

          # Liveness Probe
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  mysqladmin ping -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}" 2>/dev/null
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          # Readiness Probe
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  mysql -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" 2>/dev/null
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: shopverse-mysql-pvc
