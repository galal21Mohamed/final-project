apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopverse-frontend
  namespace: shopverse
  labels:
    app: shopverse
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopverse
      component: frontend
  template:
    metadata:
      labels:
        app: shopverse
        component: frontend
    spec:
      serviceAccountName: shopverse-frontend-sa

      # Security Context for Pod
      securityContext:
        fsGroup: 101

      # PodAntiAffinity
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: shopverse
                    component: frontend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: frontend
          image: shopverse-frontend:v1.0.0
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false

          ports:
            - containerPort: 80
              name: http

          # Resource Limits
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

          # Startup Probe
          startupProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
